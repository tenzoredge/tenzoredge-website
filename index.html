<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page title, description, canonical, Open Graph and page structured data are injected
         per page at build time (scripts/prerender.mjs) and kept in sync by react-helmet-async. -->
    <!--app-head-->

    <!-- Structured Data: Organization & ProfessionalService -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://tenzoredge.com/#organization",
          "name": "Tenzor Edge",
          "url": "https://tenzoredge.com",
          "logo": "https://tenzoredge.com/brand/PNG/tenzor-edge-logo-for-light-bg.png",
          "image": "https://tenzoredge.com/og/default.png",
          "founder": { "@id": "https://tenzoredge.com/about#founder" },
          "slogan": "Precision. Performance. Progress.",
          "description": "Technology consulting and engineering company providing solution architecture, cloud & infrastructure engineering, business digitization, and AI-enabled software engineering.",
          "email": "support@tenzoredge.com",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Bengaluru",
            "addressRegion": "Karnataka",
            "addressCountry": "IN"
          },
          "sameAs": [
            "https://www.linkedin.com/company/tenzoredge",
            "https://www.linkedin.com/in/chandantukee"
          ]
        },
        {
          "@type": "ProfessionalService",
          "@id": "https://tenzoredge.com/#service",
          "name": "Tenzor Edge",
          "url": "https://tenzoredge.com",
          "parentOrganization": {
            "@id": "https://tenzoredge.com/#organization"
          },
          "priceRange": "$$",
          "areaServed": ["India", "Global"],
          "serviceType": [
            "Technology Consulting & Solution Architecture",
            "Infrastructure & Cloud Engineering",
            "Business Solutions & Digital Transformation",
            "AI-Enabled Software Engineering",
            "Product & Technology Leadership"
          ]
        }
      ]
    }
    </script>

    <meta name="theme-color" content="#0B0D12" />
    <meta name="msapplication-TileColor" content="#0B0D12" />
    <!-- Lets CSS hide scroll-reveal content only when JavaScript can reveal it again. -->
    <script>document.documentElement.classList.add('js')</script>
  </head>
  <body class="bg-brand-white text-brand-night antialiased selection:bg-brand-edge-red selection:text-white">
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
